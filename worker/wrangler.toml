name = "mythos-forge-api"
main = "src/index.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]
account_id = "4d259cf98fff468b0108b6a80b7a10fc"

# Custom domain — bound after first deploy
[[routes]]
pattern = "api.mythos0x.com"
custom_domain = true

# R2 bucket for ephemeral media (auto-deleted after analysis)
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "mythos-forge-media"

# D1 database for users, subscriptions, usage, analyses
[[d1_databases]]
binding = "DB"
database_name = "mythos-forge"
database_id = "117161cf-7312-43be-b20c-02e6bf50a368"

# Vectorize index for Soul knowledge-base retrieval (RAG)
[[vectorize]]
binding = "VECTORIZE"
index_name = "mythos-soul-kb"

# Workers AI for embeddings (BGE base, 768 dims)
[ai]
binding = "AI"

# Hourly anomaly-alert cron — checks user_budget_daily + new subs and posts
# to ALERT_WEBHOOK_URL when something interesting happens.
[triggers]
crons = ["0 * * * *"]

# Vars (non-secret).
[vars]
ALLOWED_ORIGIN = "https://mythos0x.com"
ENABLE_MOCK_FALLBACK = "true"
SITE_URL = "https://mythos0x.com"
PRICE_PRO_MONTHLY = "price_1TUDMUQu1YpWmfU0YKer3uRx"
PRICE_PRO_YEARLY = "price_1TUDMmQu1YpWmfU0qAoMonqK"
PRICE_MAX_MONTHLY = "price_1TUDMuQu1YpWmfU04iNloR3Y"
PRICE_MAX_YEARLY = "price_1TUDN3Qu1YpWmfU0Wbeibk7t"

# Secrets (set via `wrangler secret put`):
#   SIGHTENGINE_USER + SIGHTENGINE_SECRET — detection
#   ANTHROPIC_API_KEY                     — narration
#   STRIPE_SECRET_KEY                     — sk_live_…
#   STRIPE_WEBHOOK_SECRET                 — whsec_… (from webhook endpoint)
#   RESEND_API_KEY                        — magic-link emails (optional v2)
